<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}

.big{font-size:22px;margin:2px 0}.mut{color:var(--mut);font-size:13px}.pos{color:var(--in)}.neg{color:var(--ex)}
button{font:inherit;border:1px solid var(--ln);background:#fff;border-radius:12px;padding:9px 14px;color:var(--ink)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button.dg{color:var(--ex)}button.sm{padding:4px 10px;font-size:13px;margin-top:4px}.back{border:0;background:none;padding:6px 0;font-weight:600}

.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:8px;background:#fff;border-radius:14px;box-shadow:0 1px 6px #14204A10}

.ch{width:100%;background:#fff;border-radius:16px}.lg{font-size:12px;color:var(--mut)}.lg i{display:inline-block;width:10px;height:10px;margin:0 4px 0 10px;border-radius:2px}

#sheet:not(.show){display:none}
.bd{position:fixed;inset:0;background:#0006;z-index:8}
.sh{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;z-index:9;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;max-width:720px;margin:auto}
label{display:block;margin:8px 0;font-size:13px;color:var(--mut)}
input,select{display:block;width:100%;margin-top:3px;padding:10px;font:16px system-ui;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}
input[type=checkbox]{display:inline;width:auto;margin-right:6px}
.ms{padding:8px 10px;border-radius:12px;margin:6px 0;white-space:pre-wrap}.ms.u{background:#EEE6F7;margin-left:28px}.ms.a{background:#F4EFE6;margin-right:28px}#cm{max-height:42vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;z-index:20;display:none;max-width:90%}
#toast.show{display:block}
</style></head><body>
<header><div id=av></div><div class=gr><small id=gt></small><b id=gn></b></div><span id="st"></span><button onclick="renTabs()" aria-label="Rename tabs">✎</button><button onclick="chat()" aria-label="Ask Claude">💬</button><button onclick="setg()" aria-label="Settings">⚙</button></header>
<main id="app"></main><nav id="tabs"></nav><div id="sheet"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CATS=CL.map(c=>`<option>${c}`).join(''),TN={cat:'Categories',bud:'Budget',sum:'Summary'};function applyNm(){if(D.nm){ON.me=D.nm.me;ON.wife=D.nm.wife;TN.cat=D.nm.cat||'Categories';TN.sum=D.nm.sum||'Summary';TN.bud=D.nm.bud||'Budget'}}

let D=JSON.parse(localStorage.ledger||'null')||{acc:[],tx:[],inv:[]},cfg=JSON.parse(localStorage.cfg||'{}'),tok,tc,FO='me',FT={},IM,stt;
if(!D.acc.length){const a=(id,o,b,t)=>({id,owner:o,bank:b,type:t,ob:0,upd:1});D.acc=[a('s1','me','Scotia','chequing'),a('s2','me','Scotia','savings'),a('s3','me','Scotia','credit'),a('s4','me','Neo','savings'),a('s5','me','Neo','credit')]}
D.bud??=[];D.ucat??=[];D.rules??=[];applyNm();

const accs=o=>L(D.acc).filter(a=>a.owner==o),lab=id=>{const a=D.acc.find(x=>x.id==id);return a?a.bank+' '+TY[a.type]:'?'};
function bal(a){let b=a.ob||0;L(D.tx).forEach(t=>{const m=t.kind=='income'||t.kind=='ccpay'||t.kind=='transfer';if(t.acct==a.id)b+=m?t.amt:-t.amt;if(t.from==a.id)b-=t.amt});L(D.inv).forEach(i=>{if(i.from==a.id)b-=cad(i)});return b}
function toast(m){const e=$('#toast');e.textContent=m;e.className='show';setTimeout(()=>e.className='',2800)}
function open(h){$('#sheet').innerHTML=`<div class=bd onclick=shut()></div><div class=sh>${h}</div>`;$('#sheet').className='show'}
function shut(){$('#sheet').className='';$('#sheet').innerHTML=''}

function setBank(o,i){(cfg.bk??={})[o]=i;persist();render()}
function render(){const t=cfg.tab||'me',hn=t=='wife'?ON.wife:ON.me,hr=new Date().getHours();$('#av').textContent=hn.slice(0,2).toUpperCase();$('#gt').textContent='Good '+(hr<12?'morning':hr<17?'afternoon':'evening')+',';$('#gn').textContent=hn+'! 👋';$('#tabs').innerHTML=[['me',ON.me,'👤'],['wife',ON.wife,'👥'],['cat',TN.cat,'🧾'],['bud',TN.bud,'💰'],['sum',TN.sum,'📊']].map(([k,n,ic])=>`<button class="${t==k?'on':''}" onclick="go('${k}')"><i>${ic}</i>${esc(n)}</button>`).join('');$('#app').innerHTML=cfg.pg?listPage(cfg.pg):t=='sum'?summary():t=='cat'?catTab():t=='bud'?budTab():person(t)}
function person(o){const A=accs(o),banks=['All',...new Set(A.map(a=>a.bank))],sel=banks[cfg.bk?.[o]]??'All',SA=A.filter(a=>sel=='All'||a.bank==sel),ids=SA.map(a=>a.id);
let h=HERO(o,A)+`<div class=chips>${banks.map((b,i)=>`<button class="chip ${b==sel?'on':''}" onclick="setBank('${o}',${i})">${esc(b)}</button>`).join('')}<button class=chip onclick="accForm('${o}')">+ Add account</button></div>`;

h+=`<div class=tiles>${tl('−','Add expense',`entry('${o}',{kind:'expense',date:today()})`)}${tl('+','Add income',`entry('${o}',{kind:'income',date:today()})`)}${tl('⇄','Move money',`mvForm('${o}')`)}${tl('⇪','Import',`imp('${o}')`)}${tl('✦','Categorize',`cat('${o}')`)}</div><div class=row><button onclick="mkMove('${o}')">Mark fund movements</button><button onclick="dedupe('${o}')">Remove duplicates</button></div>`;
const T=L(D.tx).filter(t=>ids.includes(t.acct)||ids.includes(t.from)).sort((a,b)=>b.date.localeCompare(a.date)||b.upd-a.upd).slice(0,200);

return h+T.map(t=>{const inn=['income','ccpay','transfer'].includes(t.kind)&&ids.includes(t.acct),mv=t.kind=='ccpay'||t.kind=='transfer';return `<div class=tx onclick="edit('${t.id}','${o}')"><div><b>${mv?'⇄ ':''}${esc(t.note||t.cat||KL[t.kind])}</b><div class=mut>${t.date} · ${KL[t.kind]} · ${esc(lab(t.acct))}${t.from?' ← '+esc(lab(t.from)):''}</div></div><div class="n ${mv?'':inn?'pos':'neg'}">${inn?'+':'-'}${fm(t.amt)}</div></div>`}).join('')}
function opts(list,sel){return list.map(a=>`<option value=${a.id} ${a.id==sel?'selected':''}>${a.owner!=FO?ON[a.owner]+': ':''}${esc(a.bank)} ${TY[a.type]}`).join('')}
function entry(o,t){FO=o;FT=t||{kind:'expense',date:today()};open(`<h3>${FT.id?'Edit':'New'} entry</h3>
<label>Type<select id=k onchange=kc()>${Object.keys(KL).map(x=>`<option value=${x} ${x==FT.kind?'selected':''}>${KL[x]}`).join('')}</select></label>
<label>Date<input type=date id=d value=${FT.date}></label><label>Amount<input type=number step=.01 inputmode=decimal id=a value="${FT.amt??''}"></label>
<label><span id=alt>Account</span><select id=ac></select></label><label id=fl>Paid from<select id=fr></select></label>
<label>Category<select id=c onchange=nc()>${catOpts(FT.cat)}</select></label><label>Note<input id=n value="${esc(FT.note||'')}"></label>
<div class=row><button class=pri onclick=sv()>Save</button>${FT.id?'<button class=dg onclick=del()>Delete</button>':''}<button onclick=shut()>Cancel</button></div>`);kc()}
function kc(){const k=$('#k').value,p=k=='ccpay'||k=='transfer',all=L(D.acc);$('#fl').style.display=p?'':'none';
const ex=FT.id&&p&&['expense','purchase'].includes(FT.kind);$('#ac').innerHTML=opts(k=='ccpay'?all.filter(a=>a.type=='credit'&&!(ex&&a.id==FT.acct)):k=='transfer'?all.filter(a=>!(ex&&a.id==FT.acct)):accs(FO),$('#ac').value||(ex?'':FT.acct));
$('#fr').innerHTML=opts(k=='ccpay'?all.filter(a=>a.type!='credit'):all,$('#fr').value||(ex?FT.acct:FT.from));
$('#alt').textContent=k=='ccpay'?'Credit card being paid':k=='transfer'?'Into account':'Account'}
function sv(){const k=$('#k').value,amt=+$('#a').value,ac=$('#ac').value,p=k=='ccpay'||k=='transfer',fr=p?$('#fr').value:'';
if(!(amt>0)||!ac||(p&&(!fr||fr==ac)))return toast('Enter an amount and account'+(p?', and pick a different “Paid from” account':''));
const t=FT.id?D.tx.find(x=>x.id==FT.id):{id:uid()};const was=FT.id?FT.cat:'',wk=FT.kind;Object.assign(t,{kind:k,date:$('#d').value,amt,acct:ac,from:fr,cat:$('#c').value=='__new'?'':$('#c').value,note:$('#n').value});if(!t.cat&&!p)t.cat=rc(t);touch(t);if(!FT.id)D.tx.push(t);const mg=p?mate(t):0;if(p&&FT.id&&['expense','purchase','income'].includes(wk)){t.cat=''}save();shut();render();if(mg)toast(mg+' matching entry merged');const mk=mer(t);if(FT.id&&!p&&t.cat&&t.cat!=was&&t.note&&!L(D.rules).some(r=>r.m.includes(mk)&&r.cat==t.cat)&&confirm('Always put “'+mk+'” entries in '+t.cat+'? This also moves your past entries from this merchant.'))moveMerchant(mk,t.cat)}
function del(){const t=D.tx.find(x=>x.id==FT.id);t.del=1;touch(t);save();shut();render()}
function edit(id,o){entry(o,D.tx.find(x=>x.id==id))}
function pay(id){const a=D.acc.find(x=>x.id==id);mvForm(a.owner,{acct:id,amt:Math.max(0,-bal(a)),date:today()})}
function accForm(o){FO=o;const bk=[...new Set(L(D.acc).filter(a=>a.owner==o).map(a=>a.bank))];open(`<h3>Add account</h3><label>Bank<input id=bn list=bl placeholder="e.g. Scotia"><datalist id=bl>${bk.map(b=>`<option>${esc(b)}`).join('')}</datalist></label>
<label>Type<select id=ty>${Object.keys(TY).map(k=>`<option value=${k}>${TY[k]}`).join('')}</select></label>
<label>Balance today (for a credit card, the amount you owe)<input type=number step=.01 id=ob value=0></label>
<div class=row><button class=pri onclick=accSv('${o}')>Add account</button><button onclick=shut()>Cancel</button></div>`)}
function accSv(o){const b=$('#bn').value.trim();if(!b)return toast('Enter the bank name');const t=$('#ty').value,v=+$('#ob').value||0;D.acc.push(touch({id:uid(),owner:o,bank:b,type:t,ob:t=='credit'?-Math.abs(v):v}));save();shut();render()}
function invf(x){x=x||{date:today(),owner:cfg.sf&&cfg.sf!='all'?cfg.sf:'me'};FT=x;FO=x.owner;open(`<h3>${x.id?'Edit':'New'} investment</h3>
<label>Owner<select id=ow onchange="FO=this.value;ik()"><option value=me ${x.owner=='me'?'selected':''}>${esc(ON.me)}<option value=wife ${x.owner=='wife'?'selected':''}>${esc(ON.wife)}</select></label>
<label>Date<input type=date id=d value=${x.date}></label><label>Amount<input type=number step=.01 inputmode=decimal id=a value="${x.amt??''}"></label><label>Currency<select id=cu>${['CAD','USD','INR'].map(c=>`<option ${c==(x.cur||'CAD')?'selected':''}>${c}`).join('')}</select></label>
<label>What (TFSA, RRSP, stocks, GIC…)<input id=n value="${esc(x.name||'')}"></label><label>Taken from account (optional)<select id=fr></select></label>
<div class=row><button class=pri onclick=invSv()>Save</button>${x.id?'<button class=dg onclick=invDel()>Delete</button>':''}<button onclick=shut()>Cancel</button></div>`);ik()}
function ik(){$('#fr').innerHTML='<option value="">Not tracked here</option>'+opts(accs(FO).filter(a=>a.type!='credit'),FT.from)}
function invSv(){const amt=+$('#a').value;if(!(amt>0))return toast('Enter an amount');const x=FT.id?D.inv.find(i=>i.id==FT.id):{id:uid()};Object.assign(x,{owner:$('#ow').value,date:$('#d').value,amt,cur:$('#cu').value,name:$('#n').value,from:$('#fr').value});touch(x);if(!FT.id)D.inv.push(x);save();shut();render()}
function invDel(){const x=D.inv.find(i=>i.id==FT.id);x.del=1;touch(x);save();shut();render()}
function summary(){const f=cfg.sf||'all',A=L(D.acc).filter(a=>f=='all'||a.owner==f),ids=A.map(a=>a.id),I=L(D.inv).filter(i=>f=='all'||i.owner==f);
const z=()=>({income:0,expense:0,purchase:0,invest:0}),M={},Y={},add=(d,k,v)=>{(M[d.slice(0,7)]??=z())[k]+=v;(Y[d.slice(0,4)]??=z())[k]+=v};
L(D.tx).forEach(t=>{if(ids.includes(t.acct)&&['income','expense','purchase'].includes(t.kind))add(t.date,t.kind,t.amt)});I.forEach(i=>add(i.date,'invest',cad(i)));
const sv=o=>o.income-o.expense-o.purchase,tot=Object.values(Y).reduce((s,y)=>{for(const k in y)s[k]+=y[k];return s},z()),nm=Math.max(1,Object.keys(M).length),nw=A.reduce((s,a)=>s+bal(a),0)+tot.invest;
const now=new Date(),ms=[];for(let i=11;i>=0;i--){const k=new Date(now.getFullYear(),now.getMonth()-i,1).toLocaleDateString('sv').slice(0,7);ms.push({k,...(M[k]||z())})}
const pc=(a,b)=>b?(a>=b?'+':'')+Math.round((a-b)/b*100)+'%':'–',st=(l,v,c='',pg='')=>`<div class=card ${pg?`onclick="cfg.pg='${pg}';persist();render()" style="cursor:pointer"`:''}><div class=mut>${l}${pg?' ›':''}</div><div class="n big ${c}">${fm(v)}</div></div>`;
let h=`<div class=chips>${[['all','Everyone'],['me',ON.me],['wife',ON.wife]].map(([k,n])=>`<button class="chip ${f==k?'on':''}" onclick="cfg.sf='${k}';persist();render()">${esc(n)}</button>`).join('')}</div>`;
h+=`<div class=hero><small>Net worth</small><div class="n huge">${fm(nw)}</div><div class=sub>Saved ${fm(sv(tot))} · Invested ${fm(tot.invest)}</div></div><div class=grid>${st('Income',tot.income,'pos','income')}${st('Expenses',tot.expense,'neg','expense')}${st('Purchases',tot.purchase,'neg','purchase')}${st('Saved (income − expenses − purchases)',sv(tot))}${st('Invested',tot.invest)}${st('Net worth (accounts + invested)',nw)}</div>`;
h+=`<h4>Monthly average</h4><div class=grid>${st('Income',tot.income/nm)}${st('Expenses + purchases',(tot.expense+tot.purchase)/nm)}${st('Saved',sv(tot)/nm)}${st('Invested',tot.invest/nm)}</div>`;
const C={income:'#2E7D5B',expense:'#B5483A',purchase:'#C98A12'},mx=Math.max(1,...ms.flatMap(m=>[m.income,m.expense,m.purchase])),bw=340/12,w=bw/4;

function catTab(){const f=cfg.sf||'all',ids=L(D.acc).filter(a=>f=='all'||a.owner==f).map(a=>a.id),now=new Date(),iso=d=>d.toLocaleDateString('sv'),rg=cfg.rg||'1',td=iso(now),fr=rg=='c'?(cfg.rf||td):iso(new Date(now.getFullYear(),now.getMonth()-(+rg-1),1)),to=rg=='c'?(cfg.rt||td):td,mm=cfg.cv=='mer',KA={},KR={},KT={},SP=['expense','purchase'];

const it=Object.entries(KA).sort((a,b)=>b[1]-a[1]);if(kt>0)h+=donut(it,kt);
h+=`<h4>By ${mm?'merchant':'category'}: ${fr} to ${to}</h4><p class=mut>Tap a row to see its entries.${mm?' Received means money in from that merchant, such as refunds and transfers.':''}</p><table class=tb><tr><th>${mm?'Merchant':'Category'}<th>Spent<th>${mm?'Received':'Share'}</tr>${CN.map((k,i)=>`<tr onclick="pickCat(${i})" style="${KA[k]||KR[k]?'':'color:#9AA5A0'}${k==sel?';background:#EEF1FA':''}"><td>${esc(k)}<td>${fm(KA[k]||0)}<td>${mm?fm(KR[k]||0):(kt?Math.round((KA[k]||0)/kt*100):0)+'%'}</tr>`).join('')}<tr><th>Total<th>${fm(kt)}<th>${mm?fm(kr):''}</tr></table>`;
if(sel&&KT[sel]){h+=`<h4>${esc(sel)}</h4><div class=row>${mm?`<button class=pri onclick=moveForm()>Move all to a category</button>`:L(D.ucat).some(c=>c.name==sel)?`<button class=dg onclick="delCat(CN.find(x=>x==cfg.cc))">Delete category</button>`:''}</div>`+KT[sel].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>{const sp=SP.includes(t.kind);return `<div class=tx onclick="edit('${t.id}','${own(t)}')"><div><b>${esc(t.note||KL[t.kind])}</b><div class=mut>${t.date} · ${KL[t.kind]} · ${esc(t.cat||'Uncategorized')} · ${esc(lab(t.acct))}</div></div><div class="n ${sp?'neg':'pos'}">${sp?'-':'+'}${fm(t.amt)}</div></div>`}).join('')}

const mkey=d=>d.toLocaleDateString('sv').slice(0,7),mlab=m=>new Date(+m.slice(0,4),+m.slice(5,7)-1,1).toLocaleDateString('en-CA',{month:'long',year:'numeric'}),curBm=()=>cfg.bm||mkey(new Date());
function shBm(n){const m=curBm();cfg.bm=mkey(new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1));persist();render()}
const bowners=()=>(cfg.bo||'me')=='both'?['me','wife']:[cfg.bo||'me'];
function budTab(){const bo=cfg.bo||'me',ow=bowners(),now=new Date(),bm=curBm(),ids=L(D.acc).filter(a=>ow.includes(a.owner)).map(a=>a.id),LN=L(D.bud).filter(b=>ow.includes(b.owner)&&b.month==bm),X=L(D.tx).filter(t=>t.bg&&ids.includes(t.acct)&&['expense','purchase'].includes(t.kind)&&t.date.slice(0,7)==bm).sort((a,b)=>b.date.localeCompare(a.date)),bt=LN.reduce((s,b)=>s+b.amt,0),xt=X.reduce((s,t)=>s+t.amt,0),av=bt-xt,dl=bm==mkey(now)?new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1:0,
bar=(v,m)=>`<div style="height:8px;border-radius:99px;background:#EFE6D8;margin-top:6px"><div style="height:8px;border-radius:99px;width:${m?Math.min(100,v/m*100):0}%;background:${v>m?'#D64550':v>m*.8?'#D9A441':'#2E9E6B'}"></div></div>`;
let h=`<div class=chips>${[['me',ON.me],['wife',ON.wife],['both','Both']].map(([k,n])=>ch(bo==k,`cfg.bo='${k}';persist();render()`,esc(n))).join('')}</div><div class=row style="justify-content:space-between;align-items:center"><button onclick="shBm(-1)">‹</button><b>${mlab(bm)}</b><button onclick="shBm(1)">›</button></div>`;
h+=`<div class=hero><small>Available to spend</small><div class="n huge" style="color:${av<0?'#FFA3AB':'#fff'}">${fm(av)}</div><div class=sub>Budget ${fm(bt)} − expenses ${fm(xt)} · ${bt?Math.round(xt/bt*100):0}% used</div>${bar(xt,bt)}${dl&&av>0?`<div class=sub style="margin-top:6px">About ${fm(av/dl)} per day for the ${dl} days left</div>`:''}${av<0?`<div class=sub style="color:#FFA3AB;margin-top:6px">Over budget by ${fm(-av)}</div>`:''}</div>`;
h+=`<h4>Planned budget</h4>`+(LN.map(b=>{const sp=X.filter(t=>t.cat==b.cat&&own(t)==b.owner).reduce((s,t)=>s+t.amt,0);return `<div class=tx onclick="budForm('${b.id}')" style="display:block"><div style="display:flex;justify-content:space-between"><b>${esc(b.cat)}${bo=='both'?' · '+esc(ON[b.owner]):''}</b><span class=n>${fm(sp)} / ${fm(b.amt)}</span></div>${bar(sp,b.amt)}</div>`}).join('')||'<p class=mut>No budget set for this month yet.</p>');
const un=X.filter(t=>!LN.some(b=>b.cat==t.cat&&b.owner==own(t))).reduce((s,t)=>s+t.amt,0);if(un>0)h+=`<div class=tx><span>Counted but not in a budget line</span><span class="n neg">${fm(un)}</span></div>`;
h+=`<div class=row>${bo=='both'?'':'<button class=pri onclick="budForm()">+ Budget line</button>'}<button onclick=budCopy()>Copy last month</button><button onclick=budPick()>Choose expenses</button></div><h4>Expenses counted against this budget</h4>`+(X.map(t=>`<div class=tx onclick="edit('${t.id}','${own(t)}')"><div><b>${esc(t.note||t.cat||KL[t.kind])}</b><div class=mut>${t.date} · ${esc(t.cat||'Uncategorized')}</div></div><div class="n neg">-${fm(t.amt)}</div></div>`).join('')||'<p class=mut>None yet. Tap “Choose expenses”, or open Expenses on the Summary tab and tick entries.</p>');return h}
function budForm(id){const b=id?D.bud.find(x=>x.id==id):{};FT={cat:b.cat};open(`<h3>${id?'Edit':'New'} budget line</h3><label>Category<select id=c onchange=nc()>${catOpts(b.cat)}</select></label><label>Planned amount for ${mlab(curBm())}<input type=number step=.01 inputmode=decimal id=a value="${b.amt??''}"></label><div class=row><button class=pri onclick="budSv('${id||''}')">Save</button>${id?`<button class=dg onclick="budDel('${id}')">Delete</button>`:''}<button onclick=shut()>Cancel</button></div>`)}
function budSv(id){const cat=$('#c').value,amt=+$('#a').value;if(!cat||cat=='__new'||!(amt>0))return toast('Choose a category and enter an amount');const b=id?D.bud.find(x=>x.id==id):{id:uid(),owner:cfg.bo=='wife'?'wife':'me',month:curBm()};Object.assign(b,{cat,amt});touch(b);if(!id)D.bud.push(b);save();shut();render()}
function budDel(id){const b=D.bud.find(x=>x.id==id);b.del=1;touch(b);save();shut();render()}
function budCopy(){const m=curBm(),pm=mkey(new Date(+m.slice(0,4),+m.slice(5,7)-2,1));L(D.bud).filter(b=>bowners().includes(b.owner)&&b.month==pm).forEach(b=>{if(!L(D.bud).some(x=>x.owner==b.owner&&x.month==m&&x.cat==b.cat))D.bud.push(touch({id:uid(),owner:b.owner,month:m,cat:b.cat,amt:b.amt}))});save();render();toast('Last month’s budget copied')}
function budPick(){const m=curBm(),ids=L(D.acc).filter(a=>bowners().includes(a.owner)).map(a=>a.id),T=L(D.tx).filter(t=>ids.includes(t.acct)&&['expense','purchase'].includes(t.kind)&&t.date.slice(0,7)==m).sort((a,b)=>b.date.localeCompare(a.date));open(`<h3>Choose expenses for ${mlab(m)}</h3><div class=row><button onclick="document.querySelectorAll('.bk').forEach(c=>c.checked=true)">Select all</button><button onclick="document.querySelectorAll('.bk').forEach(c=>c.checked=false)">Clear</button></div>${T.map(t=>`<label class=ck><input type=checkbox class=bk value="${t.id}" ${t.bg?'checked':''}><span style="flex:1">${t.date} · ${esc(t.note||t.cat||KL[t.kind])}</span><b class=n>${fm(t.amt)}</b></label>`).join('')||'<p class=mut>No expenses in this month.</p>'}<div class=row><button class=pri onclick=bkSave()>Save</button><button onclick=shut()>Cancel</button></div>`)}
function mate(t){let sa=0,sb=0,n=0;L(D.tx).forEach(x=>{if(x.id==t.id||x.amt!=t.amt||x.from||Math.abs(new Date(x.date)-new Date(t.date))>3*864e5)return;if(!sa&&x.acct==t.from&&['expense','purchase'].includes(x.kind)){x.del=1;touch(x);sa=1;n++}else if(!sb&&x.acct==t.acct&&['income','transfer'].includes(x.kind)){x.del=1;touch(x);sb=1;n++}});return n}
function toMove(t,B){const A=D.acc.find(a=>a.id==t.acct),C=D.acc.find(a=>a.id==B);if(['expense','purchase'].includes(t.kind)){t.from=t.acct;t.acct=B;t.kind=C.type=='credit'?'ccpay':'transfer'}else{t.from=B;t.kind=A.type=='credit'?'ccpay':'transfer'}t.cat='';touch(t);return mate(t)}
function mvForm(o,t){FO=o;t=t||{};const all=L(D.acc);open(`<h3>Move money</h3><p class=mut>Pay a credit card bill, or move money between your own accounts. It is not counted as an expense.</p><label>From<select id=fr>${opts(all.filter(a=>a.type!='credit'),t.from)}</select></label><label>To<select id=ac>${opts(all,t.acct)}</select></label><label>Amount<input type=number step=.01 inputmode=decimal id=a value="${t.amt??''}"></label><label>Date<input type=date id=d value="${t.date||today()}"></label><label>Note<input id=n value="${esc(t.note||'')}"></label><div class=row><button class=pri onclick=mvSv()>Move</button><button onclick=shut()>Cancel</button></div>`)}
function mvSv(){const fr=$('#fr').value,ac=$('#ac').value,amt=+$('#a').value;if(!(amt>0)||!fr||!ac||fr==ac)return toast('Enter an amount and two different accounts');const B=D.acc.find(a=>a.id==ac),t=touch({id:uid(),kind:B.type=='credit'?'ccpay':'transfer',date:$('#d').value,amt,acct:ac,from:fr,cat:'',note:$('#n').value||(B.type=='credit'?'Credit card payment':'Transfer')});D.tx.push(t);const m=mate(t);save();shut();render();toast('Money moved'+(m?' ('+m+' matching entry merged)':''))}
function mkMove(o){FO=o;const ids=accs(o).map(a=>a.id),re=/transfer|payment|pymt|tfr|pay bill|credit card|visa|mastercard/i,T=L(D.tx).filter(t=>ids.includes(t.acct)&&['expense','purchase','income'].includes(t.kind)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,150);open(`<h3>Mark fund movements</h3><p class=mut>Tick entries that were only money moving between your own accounts, such as a card payment or a chequing to savings transfer. They stop counting as income or expenses. Entries that look like transfers are pre-ticked, so please check them.</p><label>The other account<select id=ac>${opts(L(D.acc))}</select></label>${T.map(t=>`<label class=ck><input type=checkbox class=mk value="${t.id}" ${re.test(t.note||'')?'checked':''}><span style="flex:1">${t.date} · ${esc(t.note||KL[t.kind])}<br><small>${esc(lab(t.acct))}</small></span><b class=n>${t.kind=='income'?'+':'-'}${fm(t.amt)}</b></label>`).join('')||'<p class=mut>No entries.</p>'}<div class=row><button class=pri onclick=mkSv()>Mark ticked entries</button><button onclick=shut()>Cancel</button></div>`)}
function mkSv(){const B=$('#ac').value;let n=0,m=0;document.querySelectorAll('.mk').forEach(c=>{if(!c.checked)return;const t=D.tx.find(x=>x.id==c.value);if(!t||t.acct==B)return;m+=toMove(t,B);n++});save();shut();render();toast(n+' marked as fund movements'+(m?' ('+m+' matching entries merged)':''))}
function setg(){open(`<h3>Settings</h3><div class=row><button onclick="renTabs()">Rename tabs</button><button onclick="fxForm()">Exchange rates</button></div><label>Google OAuth Client ID<input id=cid value="${esc(cfg.cid||'')}" placeholder="xxxx.apps.googleusercontent.com"></label><label>Claude API key (stays on this phone only)<input id=ak type=password value="${esc(cfg.key||'')}" placeholder="sk-ant-..."></label><div class=row><button class=pri onclick="cfg.cid=$('#cid').value.trim();cfg.key=$('#ak').value.trim();tc=null;persist();shut();render();toast('Saved');cfg.cid&&sync()">Save and sync now</button></div><p class=mut>Your data is saved in a file called ledger-data.json in your Google Drive. After the first sync, share that file with your wife as Editor. She signs in on her phone with the same Client ID.</p>`)}
function auth(){if(!cfg.cid)return setg();const RU=location.origin+location.pathname.replace(/index\.html$/,'');location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:cfg.cid,redirect_uri:RU,response_type:'token',scope:'https://www.googleapis.com/auth/drive'})}
{const h=new URLSearchParams(location.hash.slice(1));if(h.get('access_token')){tok=cfg.tok=h.get('access_token');cfg.exp=Date.now()+((+h.get('expires_in')||3600)-60)*1000;persist();history.replaceState(null,'',location.pathname);setTimeout(sync,400)}else if(cfg.tok&&cfg.exp>Date.now())tok=cfg.tok}
async function api(u,o={}){const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+tok,...(o.headers||{})}});if(r.status==401){tok=null;throw 'auth'}if(!r.ok)throw await r.text();return r}
function merge(R){if(R.fx&&R.fx.upd>(D.fx?.upd||0))D.fx=R.fx;if(R.nm&&R.nm.upd>(D.nm?.upd||0)){D.nm=R.nm;applyNm()}['acc','tx','inv','bud','ucat','rules'].forEach(k=>{const m=new Map((D[k]||[]).map(x=>[x.id,x]));(R[k]||[]).forEach(x=>{const y=m.get(x.id);if(!y||x.upd>y.upd)m.set(x.id,x)});D[k]=[...m.values()]})}
async function sync(){if(!tok)return auth(sync);try{$('#st').textContent='Syncing…';const q=encodeURIComponent("name='ledger-data.json' and trashed=false"),f=(await(await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`)).json()).files[0];
if(f){const t=await(await api(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).text();if(t.trim())merge(JSON.parse(t))}
persist();const body=JSON.stringify(D);if(f)await api(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
else{const b='b'+uid();await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n{"name":"ledger-data.json"}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`})}
render();$('#st').textContent='Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){$('#st').textContent='Not synced';toast(e=='auth'?'Signed out. Tap ⚙ to sync again.':'Sync failed: '+String(e).slice(0,90))}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
