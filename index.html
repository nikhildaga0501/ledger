function holdForm(ia,hid){const h=hid?D.hold.find(x=>x.id==hid):{},q=+h.qty||0;open(`<h3>${hid?'Edit':'Add'} holding</h3><label>Symbol<input id=hs value="${esc(h.sym||'')}" placeholder="XEQT, VFV, AAPL…"></label><label>Name (optional)<input id=hn value="${esc(h.name||'')}"></label><label>Units<input type=number step=any inputmode=decimal id=hq value="${h.qty??''}"></label><label>Average cost per unit<input type=number step=any inputmode=decimal id=hc value="${q?+(h.cost/q).toFixed(4):''}"></label><label>Current price per unit<input type=number step=any inputmode=decimal id=hp value="${q?+(h.val/q).toFixed(4):''}"></label><label>Currency<select id=hu>${['CAD','USD','INR'].map(c=>`<option ${c==CUR(h.cur)?'selected':''}>${c}`).join('')}</select></label><div class=help>Value = units × price. Type the latest price from your broker, or upload a statement to fill everything in.</div><div class=row><button class=pri onclick="holdSv('${ia}','${hid||''}')">Save</button>${hid?`<button class=dg onclick="holdDel('${hid}')">Delete</button>`:''}<button onclick=shut()>Cancel</button></div>`)}
function holdSv(ia,hid){const q=+$('#hq').value,c=+$('#hc').value,p=+$('#hp').value,sym=$('#hs').value.trim().toUpperCase();if(!sym||!(q>0))return toast('Enter a symbol and the number of units');const h=hid?D.hold.find(x=>x.id==hid):{id:uid(),ia};Object.assign(h,{sym,name:$('#hn').value.trim(),qty:q,cost:q*(c||p),val:q*(p||c),cur:$('#hu').value});delete h.nc;touch(h);if(!hid)D.hold.push(h);const d=today(),a=D.ia.find(x=>x.id==ia);a.asof=d;touch(a);snapIt(ia,d);save();shut();render()}

function iaContrib(id,cid){const a=D.ia.find(x=>x.id==id),c=cid?D.inv.find(x=>x.id==cid):null;FO=a.owner;FT={from:c?c.from:''};open(`<h3>${c?'Edit':'Log a'} contribution</h3><p class=mut>${esc(a.name)}. It counts as an investment (not an expense) and lowers your contribution room.</p><label>Amount<input type=number step=.01 inputmode=decimal id=a value="${c?c.amt:''}"></label><label>Date<input type=date id=d value="${c?c.date:today()}"></label><label>Taken from account (optional)<select id=fr></select></label><div class=row><button class=pri onclick="iaCSv('${id}','${cid||''}')">Save</button>${c?`<button class=dg onclick="iaCDel('${cid}')">Delete</button>`:''}<button onclick=shut()>Cancel</button></div>`);ik()}
function iaCSv(id,cid){const a=D.ia.find(x=>x.id==id),amt=+$('#a').value;if(!(amt>0))return toast('Enter an amount');let c=cid?D.inv.find(x=>x.id==cid):null;const old=c?c.amt:0;if(/tfsa/i.test(a.name)&&a.room!=null&&amt-old>a.room&&!confirm('This is more than your TFSA room left ('+fm(a.room)+'). The CRA charges 1% a month on the excess. Save anyway?'))return;if(!c){c={id:uid(),owner:a.owner,cur:'CAD',name:a.name,ia:id};D.inv.push(c)}Object.assign(c,{date:$('#d').value,amt,from:$('#fr').value});touch(c);if(a.room!=null){a.room=Math.max(0,a.room+old-amt);touch(a)}save();shut();render();toast('Contribution saved')}

function iaStm(id){open(`<h3>Upload statement</h3><p class=mut>Upload your latest statement or holdings report (PDF or CSV). Claude reads the holdings and replaces the ones saved for this account. You can undo it right after.</p><label>File<input type=file id=sf accept=".pdf,.csv,application/pdf,text/csv" onchange="iaRead('${id}',this)"></label><div id=mp></div>`)}
function iaRead(id,inp){const f=inp.files[0];if(!f)return;$('#mp').innerHTML='<p class=mut>Claude is reading your statement. This can take up to a minute…</p>';const isP=/\.pdf$/i.test(f.name),r=new FileReader();r.onload=async()=>{try{const blk=isP?{type:'document',source:{type:'base64',media_type:'application/pdf',data:r.result.split(',')[1]}}:{type:'text',text:'Statement file contents:\n'+String(r.result).slice(0,60000)},J=await aiJ([blk,{type:'text',text:IAP}],8000),ok=/^\d{4}-\d\d-\d\d$/,asof=ok.test(J.asof||'')?J.asof:today(),rows=(J.holdings||[]).filter(x=>x&&(+x.val>0||+x.qty>0));if(!rows.length)throw 'No holdings were found in this file.';
const old=iaH(id),mo=new Map(old.map(h=>[h.sym,h])),ib=uid(),nh=rows.map(x=>{const val=+x.val||0,nc=x.cost==null||x.cost===''||!isFinite(+x.cost),h=touch({id:uid(),ia:id,sym:String(x.sym||x.name||'?').toUpperCase().slice(0,12),name:String(x.name||'').slice(0,60),qty:+x.qty||0,val,cost:nc?val:+x.cost,cur:CUR(x.cur),ib});if(nc)h.nc=1;return h}),ns=new Set(nh.map(h=>h.sym)),add=nh.filter(h=>!mo.has(h.sym)).length,rem=old.filter(h=>!ns.has(h.sym)).length,chg=nh.filter(h=>mo.has(h.sym)&&Math.abs(mo.get(h.sym).qty-h.qty)>1e-9).length,prev=old.map(h=>h.id);
old.forEach(h=>{h.del=1;touch(h)});nh.forEach(h=>D.hold.push(h));const a=D.ia.find(x=>x.id==id),pa=a.asof||'',sn0=!!L(D.snap).find(x=>x.ia==id&&x.date==asof);a.asof=asof;touch(a);snapIt(id,asof);const sid=L(D.snap).find(x=>x.ia==id&&x.date==asof).id;cfg.lh={ia:id,ib,prev,asof,pa,sid,sn0,add,rem,chg,n:nh.length};persist();save();render();
open(`<h3>✅ Holdings updated</h3><p>${nh.length} holdings · ${fm(iaVal(a))} as of ${asof}</p><p class=mut>${add} new · ${rem} removed · ${chg} with changed units</p><div class=row><button class=pri onclick=shut()>Okay</button><button class=dg onclick="iaUndo()">Undo</button></div>`)}catch(e){$('#mp').innerHTML='<p class=neg>'+esc(String(e).slice(0,200))+'</p>'}};isP?r.readAsDataURL(f):r.readAsText(f)}
function iaUndo(){const lh=cfg.lh;if(!lh)return;L(D.hold).filter(h=>h.ib==lh.ib).forEach(h=>{h.del=1;touch(h)});lh.prev.forEach(i=>{const h=D.hold.find(x=>x.id==i);if(h){delete h.del;touch(h)}});const a=D.ia.find(x=>x.id==lh.ia);a.asof=lh.pa;touch(a);if(lh.sn0)snapIt(lh.ia,lh.asof);else{const sn=D.snap.find(x=>x.id==lh.sid);if(sn){sn.del=1;touch(sn)}}cfg.lh=null;persist();save();if($('#sheet').className=='show')shut();render();toast('Holdings restored')}
function setg(){open(`<h3>Settings</h3><label class=ck><input type=checkbox ${cfg.ah!==false?'checked':''} onchange="cfg.ah=this.checked;persist()"><span>Auto-hide amounts when I leave the app or after 1 minute idle</span></label><label>Appearance<select onchange="cfg.th=this.value;document.documentElement.dataset.theme=this.value;persist()">${[['auto','Match my phone'],['light','Light'],['dark','Dark (easy on the eyes)']].map(([v,l])=>`<option value=${v} ${(cfg.th||'auto')==v?'selected':''}>${l}</option>`).join('')}</select></label><div class=row><button onclick="renTabs()">Rename tabs</button><button onclick="remForm()">Statement reminders</button><button onclick="fxForm()">Exchange rates</button><button onclick="bkForm()">Backup and restore</button><button onclick="lockForm()">App lock</button><button onclick="location.href=DEMO?location.pathname:'?demo'">${DEMO?'Exit demo':'Preview demo data'}</button><button onclick="rulesForm()">Chat rules</button></div><label>Google OAuth Client ID<input id=cid value="${esc(cfg.cid||'')}" placeholder="xxxx.apps.googleusercontent.com"></label><label>Claude API key (stays on this phone only)<input id=ak type=password value="${esc(cfg.key||'')}" placeholder="sk-ant-..."></label><div class=row><button class=pri onclick="cfg.cid=$('#cid').value.trim();cfg.key=$('#ak').value.trim();tc=null;persist();shut();render();toast('Saved');cfg.cid&&sync()">Save and sync now</button></div><p class=mut>Your data is saved in a file called ledger-data.json in your Google Drive. After the first sync, share that file with your wife as Editor. She signs in on her phone with the same Client ID.</p>`)}
function auth(){if(!cfg.cid)return setg();const RU=location.origin+location.pathname.replace(/index\.html$/,'');location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:cfg.cid,redirect_uri:RU,response_type:'token',scope:'https://www.googleapis.com/auth/drive'})}
{const h=new URLSearchParams(location.hash.slice(1));if(h.get('access_token')){tok=cfg.tok=h.get('access_token');cfg.exp=Date.now()+((+h.get('expires_in')||3600)-60)*1000;persist();history.replaceState(null,'',location.pathname);setTimeout(sync,400)}else if(cfg.tok&&cfg.exp>Date.now())tok=cfg.tok}
async function api(u,o={}){const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+tok,...(o.headers||{})}});if(r.status==401){tok=null;throw 'auth'}if(!r.ok)throw await r.text();return r}
function merge(R){if(R.fx&&R.fx.upd>(D.fx?.upd||0))D.fx=R.fx;if(R.nm&&R.nm.upd>(D.nm?.upd||0)){D.nm=R.nm;applyNm()}['acc','tx','inv','bud','ucat','rules','nrules','rem','irules','ia','hold','snap'].forEach(k=>{const m=new Map((D[k]||[]).map(x=>[x.id,x]));(R[k]||[]).forEach(x=>{const y=m.get(x.id);if(!y||x.upd>y.upd)m.set(x.id,x)});D[k]=[...m.values()]});migrateInv()}
async function sync(){if(DEMO)return;if(!tok)return auth(sync);try{$('#st').textContent='Syncing…';const q=encodeURIComponent("name='ledger-data.json' and trashed=false"),f=(await(await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`)).json()).files[0];

persist();const body=JSON.stringify(D);if(f)await api(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
else{const b='b'+uid();await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n{"name":"ledger-data.json"}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`})}
render();$('#st').textContent='Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){$('#st').textContent='Not synced';toast(e=='auth'?'Signed out. Tap ⚙ to sync again.':'Sync failed: '+String(e).slice(0,90))}}
cfg.ap='';cfg.pg='';PV=cfg.ah!==false?true:!!cfg.pv;document.documentElement.dataset.theme=cfg.th||'auto';render();LPinit();document.addEventListener('visibilitychange',()=>{if(document.hidden&&cfg.ah!==false&&!PV){PV=true;cfg.pv=true;persist()}});let IT;const idle=()=>{clearTimeout(IT);IT=setTimeout(()=>{if(cfg.ah!==false&&!PV){PV=true;cfg.pv=true;persist();render()}},60000)};['pointerdown','keydown'].forEach(e=>document.addEventListener(e,idle,{passive:true}));window.addEventListener('scroll',idle,{passive:true});idle();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){let y0=null,x0=0,pull=0,busy=0;const TH=60,ind=document.createElement('div');ind.style.cssText='position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:7px 16px;border-radius:99px;font-size:13px;z-index:300;display:none';document.body.appendChild(ind);
const top=()=>(window.scrollY||document.documentElement.scrollTop||0)<=2,blocked=()=>$('#sheet').className=='show'||$('#lock'),end=()=>{ind.style.display='none';pull=0;y0=null};
