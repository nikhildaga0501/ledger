<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ledger</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0F3D3E">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#F2F4F0;--ink:#16211E;--mut:#66726D;--pri:#0F3D3E;--in:#2E7D5B;--ex:#B5483A;--pu:#C98A12;--card:#fff;--ln:#DDE3DD}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--pri);color:#fff;position:sticky;top:0;z-index:5}
header b{font:600 20px Georgia,serif;flex:1}#st{font-size:12px;opacity:.8}
header button{background:none;border:0;color:#fff;font-size:20px;padding:0 4px}
main{padding:12px 14px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:16px 0;border:0;background:none;font:600 15px system-ui;color:var(--mut);border-top:3px solid transparent}
nav button.on{color:var(--pri);border-top-color:var(--pu)}
.n{font-family:"Iowan Old Style",Georgia,serif;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{white-space:nowrap;border:1px solid var(--ln);background:#fff;border-radius:99px;padding:7px 14px;font:inherit}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px}
.big{font-size:22px;margin:2px 0}.mut{color:var(--mut);font-size:13px}
.pos{color:var(--in)}.neg{color:var(--ex)}
button{font:inherit;border:1px solid var(--ln);background:#fff;border-radius:8px;padding:9px 14px;color:var(--ink)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button.dg{color:var(--ex)}button.sm{padding:4px 10px;font-size:13px;margin-top:4px}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.tx{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln)}
h3{margin:4px 0 8px;font:600 18px Georgia,serif}h4{margin:18px 0 6px;font:600 16px Georgia,serif}
.tb{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--ln)}
.tb td,.tb th{padding:6px;text-align:right;border-bottom:1px solid var(--ln)}.tb td:first-child,.tb th:first-child{text-align:left}
.ch{width:100%;background:#fff;border:1px solid var(--ln);border-radius:10px}
.lg{font-size:12px;color:var(--mut)}.lg i{display:inline-block;width:10px;height:10px;margin:0 4px 0 10px;border-radius:2px}
#sheet:not(.show){display:none}
.bd{position:fixed;inset:0;background:#0006;z-index:8}
.sh{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;z-index:9;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;max-width:720px;margin:auto}
label{display:block;margin:8px 0;font-size:13px;color:var(--mut)}
input,select{display:block;width:100%;margin-top:3px;padding:10px;font:16px system-ui;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{display:inline;width:auto;margin-right:6px}
.ms{padding:8px 10px;border-radius:10px;margin:6px 0;white-space:pre-wrap}.ms.u{background:#E3EEE8;margin-left:28px}.ms.a{background:#F3F3EF;margin-right:28px}#cm{max-height:42vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;z-index:20;display:none;max-width:90%}
#toast.show{display:block}
</style></head><body>
<header><b>Ledger</b><span id="st"></span><button onclick="chat()" aria-label="Ask Claude">💬</button><button onclick="setg()" aria-label="Settings">⚙</button></header>
<main id="app"></main><nav id="tabs"></nav><div id="sheet"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
const TY={chequing:'Chequing',savings:'Savings',credit:'Credit card'},KL={income:'Income',expense:'Expense',purchase:'Purchase',transfer:'Transfer',ccpay:'Card payment'},ON={me:'Nikhil',wife:'Wife'};
const CATS=['Salary','Groceries','Rent','Utilities','Dining','Transport','Shopping','Health','Travel','Subscriptions','Other'].map(c=>`<option>${c}`).join('');
const today=()=>new Date().toLocaleDateString('sv'),L=a=>(a||[]).filter(x=>!x.del),touch=o=>(o.upd=Date.now(),o);
let D=JSON.parse(localStorage.ledger||'null')||{acc:[],tx:[],inv:[]},cfg=JSON.parse(localStorage.cfg||'{}'),tok,tc,FO='me',FT={},IM,stt;
if(!D.acc.length){const a=(id,o,b,t)=>({id,owner:o,bank:b,type:t,ob:0,upd:1});D.acc=[a('s1','me','Scotia','chequing'),a('s2','me','Scotia','savings'),a('s3','me','Scotia','credit'),a('s4','me','Neo','savings'),a('s5','me','Neo','credit')]}
if(D.nm){ON.me=D.nm.me;ON.wife=D.nm.wife}
const persist=()=>{localStorage.ledger=JSON.stringify(D);localStorage.cfg=JSON.stringify(cfg)};
const save=()=>{persist();if(tok){clearTimeout(stt);stt=setTimeout(sync,1500)}};
const accs=o=>L(D.acc).filter(a=>a.owner==o),lab=id=>{const a=D.acc.find(x=>x.id==id);return a?a.bank+' '+TY[a.type]:'?'};
function bal(a){let b=a.ob||0;L(D.tx).forEach(t=>{const m=t.kind=='income'||t.kind=='ccpay'||t.kind=='transfer';if(t.acct==a.id)b+=m?t.amt:-t.amt;if(t.from==a.id)b-=t.amt});L(D.inv).forEach(i=>{if(i.from==a.id)b-=i.amt});return b}
function toast(m){const e=$('#toast');e.textContent=m;e.className='show';setTimeout(()=>e.className='',2800)}
function open(h){$('#sheet').innerHTML=`<div class=bd onclick=shut()></div><div class=sh>${h}</div>`;$('#sheet').className='show'}
function shut(){$('#sheet').className='';$('#sheet').innerHTML=''}
function go(t){cfg.tab=t;persist();render()}
function setBank(o,i){(cfg.bk??={})[o]=i;persist();render()}
function render(){const t=cfg.tab||'me';$('#tabs').innerHTML=[['me',ON.me],['wife',ON.wife],['sum','Summary']].map(([k,n])=>`<button class="${t==k?'on':''}" onclick="go('${k}')">${esc(n)}</button>`).join('');$('#app').innerHTML=t=='sum'?summary():person(t)}
function person(o){const A=accs(o),banks=['All',...new Set(A.map(a=>a.bank))],sel=banks[cfg.bk?.[o]]??'All',SA=A.filter(a=>sel=='All'||a.bank==sel),ids=SA.map(a=>a.id);
let h=`<div class=chips>${banks.map((b,i)=>`<button class="chip ${b==sel?'on':''}" onclick="setBank('${o}',${i})">${esc(b)}</button>`).join('')}<button class=chip onclick="accForm('${o}')">+ Add account</button></div>`;
if(!SA.length)return h+'<p class=mut>No accounts yet. Tap “+ Add account” and enter the bank name, account type and current balance.</p>';
h+='<div class=grid>'+SA.map(a=>{const b=bal(a),cr=a.type=='credit';return `<div class=card><div class=mut>${esc(a.bank)} · ${TY[a.type]}</div><div class="n big ${cr&&b<0?'neg':''}">${fm(cr?-b:b)}</div><div class=mut>${cr?'Owed':'Balance'}</div><button class=sm onclick="accEdit('${a.id}')">Edit</button> ${cr&&b<0?`<button class="sm pri" onclick="pay('${a.id}')">Pay bill</button>`:''}</div>`}).join('')+'</div>';
h+=`<div class=row><button class=pri onclick="entry('${o}')">+ Add entry</button><button onclick="imp('${o}')">Import CSV or PDF</button><button onclick="cat('${o}')">Categorize</button><button onclick="dedupe('${o}')">Remove duplicates</button></div>`;
const T=L(D.tx).filter(t=>ids.includes(t.acct)||ids.includes(t.from)).sort((a,b)=>b.date.localeCompare(a.date)||b.upd-a.upd).slice(0,200);
if(!T.length)return h+'<p class=mut>No entries yet. Add one or import a bank CSV.</p>';
return h+T.map(t=>{const inn=['income','ccpay','transfer'].includes(t.kind)&&ids.includes(t.acct);return `<div class=tx onclick="edit('${t.id}','${o}')"><div><b>${esc(t.note||t.cat||KL[t.kind])}</b><div class=mut>${t.date} · ${KL[t.kind]} · ${esc(lab(t.acct))}${t.from?' ← '+esc(lab(t.from)):''}</div></div><div class="n ${inn?'pos':'neg'}">${inn?'+':'-'}${fm(t.amt)}</div></div>`}).join('')}
function opts(list,sel){return list.map(a=>`<option value=${a.id} ${a.id==sel?'selected':''}>${a.owner!=FO?ON[a.owner]+': ':''}${esc(a.bank)} ${TY[a.type]}`).join('')}
function entry(o,t){FO=o;FT=t||{kind:'expense',date:today()};open(`<h3>${FT.id?'Edit':'New'} entry</h3>
<label>Type<select id=k onchange=kc()>${Object.keys(KL).map(x=>`<option value=${x} ${x==FT.kind?'selected':''}>${KL[x]}`).join('')}</select></label>
<label>Date<input type=date id=d value=${FT.date}></label><label>Amount<input type=number step=.01 inputmode=decimal id=a value="${FT.amt??''}"></label>
<label><span id=alt>Account</span><select id=ac></select></label><label id=fl>Paid from<select id=fr></select></label>
<label>Category<input id=c list=cats value="${esc(FT.cat||'')}"><datalist id=cats>${CATS}</datalist></label><label>Note<input id=n value="${esc(FT.note||'')}"></label>
<div class=row><button class=pri onclick=sv()>Save</button>${FT.id?'<button class=dg onclick=del()>Delete</button>':''}<button onclick=shut()>Cancel</button></div>`);kc()}
function kc(){const k=$('#k').value,p=k=='ccpay'||k=='transfer',all=L(D.acc);$('#fl').style.display=p?'':'none';
$('#ac').innerHTML=opts(k=='ccpay'?all.filter(a=>a.type=='credit'):k=='transfer'?all:accs(FO),$('#ac').value||FT.acct);
$('#fr').innerHTML=opts(k=='ccpay'?all.filter(a=>a.type!='credit'):all,$('#fr').value||FT.from);
$('#alt').textContent=k=='ccpay'?'Credit card being paid':k=='transfer'?'Into account':'Account'}
function sv(){const k=$('#k').value,amt=+$('#a').value,ac=$('#ac').value,p=k=='ccpay'||k=='transfer',fr=p?$('#fr').value:'';
if(!(amt>0)||!ac||(p&&(!fr||fr==ac)))return toast('Enter an amount and account'+(p?', and pick a different “Paid from” account':''));
const t=FT.id?D.tx.find(x=>x.id==FT.id):{id:uid()};Object.assign(t,{kind:k,date:$('#d').value,amt,acct:ac,from:fr,cat:$('#c').value,note:$('#n').value});touch(t);if(!FT.id)D.tx.push(t);save();shut();render()}
function del(){const t=D.tx.find(x=>x.id==FT.id);t.del=1;touch(t);save();shut();render()}
function edit(id,o){entry(o,D.tx.find(x=>x.id==id))}
function pay(id){const a=D.acc.find(x=>x.id==id);entry(a.owner,{kind:'ccpay',date:today(),acct:id,amt:Math.max(0,-bal(a)),note:'Credit card payment'})}
function accForm(o){FO=o;const bk=[...new Set(L(D.acc).filter(a=>a.owner==o).map(a=>a.bank))];open(`<h3>Add account</h3><label>Bank<input id=bn list=bl placeholder="e.g. Scotia"><datalist id=bl>${bk.map(b=>`<option>${esc(b)}`).join('')}</datalist></label>
<label>Type<select id=ty>${Object.keys(TY).map(k=>`<option value=${k}>${TY[k]}`).join('')}</select></label>
<label>Balance today (for a credit card, the amount you owe)<input type=number step=.01 id=ob value=0></label>
<div class=row><button class=pri onclick=accSv('${o}')>Add account</button><button onclick=shut()>Cancel</button></div>`)}
function accSv(o){const b=$('#bn').value.trim();if(!b)return toast('Enter the bank name');const t=$('#ty').value,v=+$('#ob').value||0;D.acc.push(touch({id:uid(),owner:o,bank:b,type:t,ob:t=='credit'?-Math.abs(v):v}));save();shut();render()}
function invf(x){x=x||{date:today(),owner:cfg.sf&&cfg.sf!='all'?cfg.sf:'me'};FT=x;FO=x.owner;open(`<h3>${x.id?'Edit':'New'} investment</h3>
<label>Owner<select id=ow onchange="FO=this.value;ik()"><option value=me ${x.owner=='me'?'selected':''}>${esc(ON.me)}<option value=wife ${x.owner=='wife'?'selected':''}>${esc(ON.wife)}</select></label>
<label>Date<input type=date id=d value=${x.date}></label><label>Amount<input type=number step=.01 inputmode=decimal id=a value="${x.amt??''}"></label>
<label>What (TFSA, RRSP, stocks, GIC…)<input id=n value="${esc(x.name||'')}"></label><label>Taken from account (optional)<select id=fr></select></label>
<div class=row><button class=pri onclick=invSv()>Save</button>${x.id?'<button class=dg onclick=invDel()>Delete</button>':''}<button onclick=shut()>Cancel</button></div>`);ik()}
function ik(){$('#fr').innerHTML='<option value="">Not tracked here</option>'+opts(accs(FO).filter(a=>a.type!='credit'),FT.from)}
function invSv(){const amt=+$('#a').value;if(!(amt>0))return toast('Enter an amount');const x=FT.id?D.inv.find(i=>i.id==FT.id):{id:uid()};Object.assign(x,{owner:$('#ow').value,date:$('#d').value,amt,name:$('#n').value,from:$('#fr').value});touch(x);if(!FT.id)D.inv.push(x);save();shut();render()}
function invDel(){const x=D.inv.find(i=>i.id==FT.id);x.del=1;touch(x);save();shut();render()}
function summary(){const f=cfg.sf||'all',A=L(D.acc).filter(a=>f=='all'||a.owner==f),ids=A.map(a=>a.id),I=L(D.inv).filter(i=>f=='all'||i.owner==f);
const z=()=>({income:0,expense:0,purchase:0,invest:0}),M={},Y={},add=(d,k,v)=>{(M[d.slice(0,7)]??=z())[k]+=v;(Y[d.slice(0,4)]??=z())[k]+=v};
L(D.tx).forEach(t=>{if(ids.includes(t.acct)&&['income','expense','purchase'].includes(t.kind))add(t.date,t.kind,t.amt)});I.forEach(i=>add(i.date,'invest',i.amt));
const sv=o=>o.income-o.expense-o.purchase,tot=Object.values(Y).reduce((s,y)=>{for(const k in y)s[k]+=y[k];return s},z()),nm=Math.max(1,Object.keys(M).length),nw=A.reduce((s,a)=>s+bal(a),0)+tot.invest;
const now=new Date(),ms=[];for(let i=11;i>=0;i--){const k=new Date(now.getFullYear(),now.getMonth()-i,1).toLocaleDateString('sv').slice(0,7);ms.push({k,...(M[k]||z())})}
const pc=(a,b)=>b?(a>=b?'+':'')+Math.round((a-b)/b*100)+'%':'–',st=(l,v,c='')=>`<div class=card><div class=mut>${l}</div><div class="n big ${c}">${fm(v)}</div></div>`;
let h=`<div class=chips>${[['all','Everyone'],['me',ON.me],['wife',ON.wife]].map(([k,n])=>`<button class="chip ${f==k?'on':''}" onclick="cfg.sf='${k}';persist();render()">${esc(n)}</button>`).join('')}</div>`;
h+=`<div class=grid>${st('Income',tot.income,'pos')}${st('Expenses',tot.expense,'neg')}${st('Purchases',tot.purchase,'neg')}${st('Saved (income − expenses − purchases)',sv(tot))}${st('Invested',tot.invest)}${st('Net worth (accounts + invested)',nw)}</div>`;
h+=`<h4>Monthly average</h4><div class=grid>${st('Income',tot.income/nm)}${st('Expenses + purchases',(tot.expense+tot.purchase)/nm)}${st('Saved',sv(tot)/nm)}${st('Invested',tot.invest/nm)}</div>`;
const C={income:'#2E7D5B',expense:'#B5483A',purchase:'#C98A12'},mx=Math.max(1,...ms.flatMap(m=>[m.income,m.expense,m.purchase])),bw=340/12,w=bw/4;
h+=`<h4>Last 12 months</h4><svg class=ch viewBox="0 0 340 170">${ms.map((m,i)=>['income','expense','purchase'].map((k,j)=>{const ht=m[k]/mx*140;return `<rect x="${i*bw+j*w+w/2}" y="${150-ht}" width="${w-1}" height="${ht}" fill="${C[k]}"/>`}).join('')+`<text x="${i*bw+bw/2}" y="164" text-anchor="middle" font-size="8" fill="#66726D">${m.k.slice(5)}</text>`).join('')}</svg><div class=lg><i style="background:${C.income}"></i>Income<i style="background:${C.expense}"></i>Expenses<i style="background:${C.purchase}"></i>Purchases</div>`;
h+=`<h4>Month on month</h4><table class=tb><tr><th>Month<th>Income<th>Spent<th>Saved<th>Spend Δ</tr>${ms.slice(6).map((m,i)=>{const p=ms[5+i],s=m.expense+m.purchase;return `<tr><td>${m.k}<td>${fm(m.income)}<td>${fm(s)}<td>${fm(sv(m))}<td>${pc(s,p.expense+p.purchase)}</tr>`}).join('')}</table>`;
const sm=cfg.cm||now.toLocaleDateString('sv').slice(0,7),cmv=sm=='all'?null:new Date(+sm.slice(0,4),+sm.slice(5,7)-1,1),pk=cmv?new Date(cmv.getFullYear(),cmv.getMonth()-1,1).toLocaleDateString('sv').slice(0,7):'',KA={},KB={};
L(D.tx).forEach(t=>{if(!ids.includes(t.acct)||!['expense','purchase'].includes(t.kind))return;const k=t.cat||'Uncategorized',mk=t.date.slice(0,7);if(sm=='all'||mk==sm)KA[k]=(KA[k]||0)+t.amt;if(mk==pk)KB[k]=(KB[k]||0)+t.amt});
const kt=Object.values(KA).reduce((a,b)=>a+b,0),kr=Object.entries(KA).sort((a,b)=>b[1]-a[1]),tm=now.toLocaleDateString('sv').slice(0,7),lm=new Date(now.getFullYear(),now.getMonth()-1,1).toLocaleDateString('sv').slice(0,7);
h+=`<h4>Spending by category (${sm=='all'?'all time':sm})</h4><div class=chips><button class="chip ${sm==tm?'on':''}" onclick="cfg.cm='${tm}';persist();render()">This month</button><button class="chip ${sm==lm?'on':''}" onclick="cfg.cm='${lm}';persist();render()">Last month</button><button class="chip ${sm=='all'?'on':''}" onclick="cfg.cm='all';persist();render()">All time</button></div><label>Pick any month<input type=month value="${sm=='all'?'':sm}" onchange="cfg.cm=this.value||'all';persist();render()"></label>`+(kr.length?`<table class=tb><tr><th>Category<th>Spent<th>Share${sm=='all'?'':'<th>Previous month'}</tr>${kr.map(([k,v])=>`<tr><td>${esc(k)}<td>${fm(v)}<td>${Math.round(v/kt*100)}%${sm=='all'?'':`<td>${fm(KB[k]||0)}`}</tr>`).join('')}<tr><th>Total<th>${fm(kt)}<th>${sm=='all'?'':'<th>'+fm(Object.values(KB).reduce((a,b)=>a+b,0))}</tr></table>`+(KA.Uncategorized?'<p class=mut>Some entries have no category yet. Open a person tab and tap Categorize.</p>':''):'<p class=mut>No spending recorded for this period.</p>');
const ys=Object.keys(Y).sort();h+=`<h4>Year on year</h4><table class=tb><tr><th>Year<th>Income<th>Expenses<th>Purchases<th>Saved<th>Invested<th>Spend Δ</tr>${ys.map((y,i)=>{const o=Y[y],p=Y[ys[i-1]];return `<tr><td>${y}<td>${fm(o.income)}<td>${fm(o.expense)}<td>${fm(o.purchase)}<td>${fm(sv(o))}<td>${fm(o.invest)}<td>${p?pc(o.expense+o.purchase,p.expense+p.purchase):'–'}</tr>`}).join('')||'<tr><td colspan=7>No data yet</tr>'}</table>`;
h+=`<h4>Investments</h4><div class=row><button class=pri onclick="invf()">+ Add investment</button></div>`+(I.sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<div class=tx onclick="invf(D.inv.find(x=>x.id=='${i.id}'))"><div><b>${esc(i.name||'Investment')}</b><div class=mut>${i.date} · ${ON[i.owner]}${i.from?' ← '+esc(lab(i.from)):''}</div></div><div class=n>${fm(i.amt)}</div></div>`).join('')||'<p class=mut>Nothing recorded yet.</p>');return h}
function csv(t){const r=[];let row=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==','){row.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=h}if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.join('').trim())}
function imp(o){FO=o;open(`<h3>Import statement</h3><label>Into account<select id=ac>${opts(accs(o))}</select></label><label>CSV or PDF statement (from your bank’s website or app)<input type=file id=f accept=".csv,.pdf,text/csv,application/pdf" onchange=rd(this)></label><div id=mp></div>`)}
function rd(i){if(/\.pdf$/i.test(i.files[0].name))return pdf(i.files[0]);const r=new FileReader();r.onload=()=>{IM=csv(r.result);const h=IM[0].map(x=>x.trim().toLowerCase()),f=(...ks)=>Math.max(0,h.findIndex(x=>ks.some(k=>x.includes(k)))),O=IM[0].map((x,j)=>`<option value=${j}>${esc(x)}`).join('');
$('#mp').innerHTML=`<label>Date column<select id=cd>${O}</select></label><label>Description column<select id=cn>${O}</select></label><label>Amount column<select id=cm>${O}</select></label><label><input type=checkbox id=fp>Positive amounts are money spent (common on credit cards)</label><p class=mut>${IM.length-1} rows found. Rows already in the app are skipped.</p><button class=pri onclick=doImp()>Import</button>`;
$('#cd').value=f('date');$('#cn').value=f('desc','merchant','name','detail');$('#cm').value=f('amount','cad','amt');const a=D.acc.find(x=>x.id==$('#ac').value);$('#fp').checked=a&&a.type=='credit'};r.readAsText(i.files[0])}
function doImp(){const ac=$('#ac').value,c=[+$('#cd').value,+$('#cn').value,+$('#cm').value],fp=$('#fp').checked,cr=D.acc.find(x=>x.id==ac).type=='credit',seen=new Set(L(D.tx).filter(t=>t.acct==ac).map(t=>[t.date,t.amt,t.note].join('|')));let n=0;
IM.slice(1).forEach(r=>{const v=(r[c[2]]||'').replace(/[$,\s]/g,''),neg=/^\(.*\)$/.test(v)||v.startsWith('-'),a=Math.abs(parseFloat(v.replace(/[()\-]/g,''))),raw=(r[c[0]]||'').trim(),d=/^\d{4}-\d\d-\d\d/.test(raw)?raw.slice(0,10):isNaN(Date.parse(raw))?null:new Date(Date.parse(raw)).toLocaleDateString('sv'),note=(r[c[1]]||'').trim();
if(!a||!d)return;const sp=neg!=fp,key=[d,a,note].join('|');if(seen.has(key))return;seen.add(key);D.tx.push(touch({id:uid(),kind:sp?'expense':cr?'transfer':'income',date:d,amt:a,acct:ac,from:'',cat:'',note}));n++});save();shut();render();toast(n+' entries imported');if(cfg.key&&n)cat(FO)}
const CL=['Salary','Groceries','Rent','Utilities','Dining','Transport','Shopping','Health','Travel','Subscriptions','Fees','Other'];
async function ask(messages,max,system){if(!cfg.key){setg();throw 'Add your Claude API key first'}const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:max,...(system?{system}:{}),messages})}),j=await r.json();if(!r.ok)throw j.error?.message||'Claude error';return j.content.map(c=>c.text||'').join('')}
async function ai(content,max){const t=await ask([{role:'user',content}],max);try{return JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1))}catch{throw 'Claude’s answer could not be read. Try again, or use a shorter statement.'}}
function pdf(f){const ac=$('#ac').value,cr=D.acc.find(x=>x.id==ac).type=='credit';$('#mp').innerHTML='<p class=mut>Claude is reading your statement. This can take up to a minute…</p>';const r=new FileReader();r.onload=async()=>{try{const rows=await ai([{type:'document',source:{type:'base64',media_type:'application/pdf',data:r.result.split(',')[1]}},{type:'text',text:'List every transaction in this bank or credit card statement. Reply with ONLY a JSON array and no other text. Each item: {"d":"YYYY-MM-DD","n":"description","a":amount as a positive number,"in":true if money came into the account (deposit, refund, payment received) otherwise false,"c":one of '+CL.join(', ')+'}. Skip balances and totals.'}],16000),seen=new Set(L(D.tx).filter(t=>t.acct==ac).map(t=>[t.date,t.amt,t.note].join('|')));let n=0;rows.forEach(x=>{const a=Math.abs(+x.a),k=[x.d,a,x.n].join('|');if(!a||!/^\d{4}-\d\d-\d\d$/.test(x.d)||seen.has(k))return;seen.add(k);D.tx.push(touch({id:uid(),kind:x.in?(cr?'transfer':'income'):'expense',date:x.d,amt:a,acct:ac,from:'',cat:CL.includes(x.c)?x.c:'',note:String(x.n||'').trim()}));n++});save();shut();render();toast(n+' entries added from the PDF')}catch(e){$('#mp').innerHTML='<p class=neg>'+esc(String(e).slice(0,200))+'</p>'}};r.readAsDataURL(f)}
async function cat(o){const ids=accs(o).map(a=>a.id),T=L(D.tx).filter(t=>ids.includes(t.acct)&&!t.cat&&['income','expense','purchase'].includes(t.kind)).slice(0,150);if(!T.length)return toast('Everything is already categorized');toast('Categorizing '+T.length+' entries…');try{const m=await ai('Give each bank transaction one category from: '+CL.join(', ')+'. Reply with ONLY a JSON array like [{"i":0,"c":"Dining"}], one item per transaction.\n'+T.map((t,i)=>i+': '+(t.note||'')+' ('+t.kind+', $'+t.amt+')').join('\n'),6000);m.forEach(x=>{const t=T[x.i];if(t&&CL.includes(x.c)){t.cat=x.c;touch(t)}});save();render();toast('Done. Categories added.')}catch(e){toast(String(e).slice(0,120))}}
async function dedupe(o){const ids=accs(o).map(a=>a.id),seen=new Set(),d=[],T=L(D.tx).filter(t=>ids.includes(t.acct)).sort((a,b)=>a.upd-b.upd);
T.forEach(t=>{const k=[t.acct,t.kind,t.date,t.amt,(t.note||'').trim().toLowerCase(),t.from].join('|');seen.has(k)?d.push(t):seen.add(k)});
if(cfg.key){const R=T.filter(t=>!d.includes(t)),P=[];for(let i=0;i<R.length;i++)for(let j=i+1;j<R.length;j++){const a=R[i],b=R[j];if(a.acct==b.acct&&a.kind==b.kind&&a.amt==b.amt&&Math.abs(new Date(a.date)-new Date(b.date))<=3*864e5)P.push([a,b])}
if(P.length&&P.length<=150){toast('Claude is checking '+P.length+' similar pairs…');try{const r=await ai('Each line is a pair of bank transactions with the same amount within 3 days. Decide which pairs are the SAME real transaction recorded twice (for example one purchase imported from both a CSV and a PDF, or a pending and a posted copy with a slightly different description). Different purchases, or regular repeating charges, are NOT duplicates. Reply with ONLY a JSON array of the pair numbers that are duplicates, like [0,3].\n'+P.map((p,i)=>i+': '+p.map(t=>t.date+' '+(t.note||'')).join('  <->  ')+' ($'+p[0].amt+')').join('\n'),1000);r.forEach(i=>{const b=P[i]&&P[i][1];if(b&&!d.includes(b))d.push(b)})}catch(e){toast(String(e).slice(0,100))}}}
if(!d.length)return toast('No duplicates found');if(!confirm(d.length+' duplicate entries found, for example: '+d.slice(0,3).map(t=>t.date+' '+(t.note||KL[t.kind])).join(', ')+'. Remove them?'))return;d.forEach(t=>{t.del=1;touch(t)});save();render();toast(d.length+' duplicates removed')}
function accEdit(id){const a=D.acc.find(x=>x.id==id),cr=a.type=='credit',b=bal(a);open(`<h3>Edit account</h3><label>Bank name (renames it for all accounts at this bank)<input id=bn value="${esc(a.bank)}"></label><label>Type<select id=ty>${Object.keys(TY).map(k=>`<option value=${k} ${k==a.type?'selected':''}>${TY[k]}`).join('')}</select></label><label>${cr?'Amount owed today':'Balance today'} (changing it adjusts the starting balance)<input type=number step=.01 id=ob value="${(cr?-b:b).toFixed(2)}"></label><div class=row><button class=pri onclick="accUp('${id}')">Save</button><button class=dg onclick="accDel('${id}')">Delete account</button><button onclick=shut()>Cancel</button></div>`)}
function accUp(id){const a=D.acc.find(x=>x.id==id),nb=$('#bn').value.trim(),t=$('#ty').value,v=+$('#ob').value||0;if(!nb)return toast('Enter the bank name');a.ob=(a.ob||0)+((t=='credit'?-v:v)-bal(a));a.type=t;if(nb!=a.bank){L(D.acc).filter(x=>x.owner==a.owner&&x.bank==a.bank).forEach(x=>{x.bank=nb;touch(x)});(cfg.bk??={})[a.owner]=0}touch(a);save();shut();render()}
function accDel(id){if(!confirm('Delete this account? Its entries will be hidden too.'))return;const a=D.acc.find(x=>x.id==id);a.del=1;touch(a);save();shut();render()}
let CH=[];
function ctx(){const nm=o=>ON[o],lb=id=>{const a=D.acc.find(x=>x.id==id);return a?nm(a.owner)+' '+a.bank+' '+TY[a.type]:'?'},S={};
L(D.tx).forEach(t=>{if(!['income','expense','purchase'].includes(t.kind))return;const a=D.acc.find(x=>x.id==t.acct);if(!a||a.del)return;const k=nm(a.owner)+' '+t.date.slice(0,7)+' '+t.kind+' '+(t.cat||'Uncategorized');S[k]=(S[k]||0)+t.amt});
return 'ACCOUNTS (balance, or amount owed for credit cards):\n'+L(D.acc).map(a=>{const b=bal(a);return lb(a.id)+': '+(a.type=='credit'?'owes '+(-b).toFixed(2):b.toFixed(2))}).join('\n')+'\nMONTHLY TOTALS (person month type category = amount):\n'+Object.entries(S).map(([k,v])=>k+' = '+v.toFixed(2)).join('\n')+'\nINVESTMENTS (date owner name amount):\n'+L(D.inv).map(i=>i.date+' '+nm(i.owner)+' '+(i.name||'')+' '+i.amt).join('\n')+'\nRECENT TRANSACTIONS (date | account | type | amount | category | note):\n'+L(D.tx).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,500).map(t=>[t.date,lb(t.acct),KL[t.kind],t.amt,t.cat||'',t.note||''].join(' | ')).join('\n')}
function chat(){open(`<h3>Ask about your money</h3><div id=cm></div><label><input id=q placeholder="e.g. How much did we spend on dining last month?" onkeydown="if(event.key=='Enter')send()"></label><div class=row><button class=pri onclick=send()>Ask</button><button onclick="CH=[];showCh()">Clear</button><button onclick=shut()>Close</button></div>`);showCh()}
function showCh(){const e=$('#cm');if(!e)return;e.innerHTML=CH.length?CH.map(m=>`<div class="ms ${m.role=='user'?'u':'a'}">${esc(m.content)}</div>`).join(''):'<p class=mut>Ask anything about your accounts, spending, savings or investments.</p>';e.scrollTop=1e5}
async function send(){const q=$('#q').value.trim();if(!q)return;$('#q').value='';CH.push({role:'user',content:q});showCh();let m=CH.slice(-8);if(m[0].role!='user')m=m.slice(1);try{const t=await ask(m,1500,'You are a helpful assistant inside a household expense app used by '+ON.me+' and '+ON.wife+'. Answer only from the data below, in plain simple language, and keep answers short. Amounts are in CAD. Transfers and credit card payments are not income or spending. If the data does not contain the answer, say so. Never make up numbers.\nToday is '+today()+'.\n'+ctx());CH.push({role:'assistant',content:t})}catch(e){CH.push({role:'assistant',content:'Sorry, that did not work: '+String(e).slice(0,150)})}showCh()}
function setg(){open(`<h3>Settings</h3><label>First tab name<input id=n1 value="${esc(ON.me)}"></label><label>Second tab name<input id=n2 value="${esc(ON.wife)}"></label><label>Google OAuth Client ID<input id=cid value="${esc(cfg.cid||'')}" placeholder="xxxx.apps.googleusercontent.com"></label><label>Claude API key (stays on this phone only)<input id=ak type=password value="${esc(cfg.key||'')}" placeholder="sk-ant-..."></label><div class=row><button class=pri onclick="cfg.cid=$('#cid').value.trim();cfg.key=$('#ak').value.trim();tc=null;const a=$('#n1').value.trim()||'Nikhil',b=$('#n2').value.trim()||'Wife';if(a!=ON.me||b!=ON.wife){D.nm={me:a,wife:b,upd:Date.now()};ON.me=a;ON.wife=b}persist();shut();render();toast('Saved');cfg.cid&&sync()">Save and sync now</button></div><p class=mut>Your data is saved in a file called ledger-data.json in your Google Drive. After the first sync, share that file with your wife as Editor. She signs in on her phone with the same Client ID.</p>`)}
function auth(){if(!cfg.cid)return setg();const RU=location.origin+location.pathname.replace(/index\.html$/,'');location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:cfg.cid,redirect_uri:RU,response_type:'token',scope:'https://www.googleapis.com/auth/drive'})}
{const h=new URLSearchParams(location.hash.slice(1));if(h.get('access_token')){tok=cfg.tok=h.get('access_token');cfg.exp=Date.now()+((+h.get('expires_in')||3600)-60)*1000;persist();history.replaceState(null,'',location.pathname);setTimeout(sync,400)}else if(cfg.tok&&cfg.exp>Date.now())tok=cfg.tok}
async function api(u,o={}){const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+tok,...(o.headers||{})}});if(r.status==401){tok=null;throw 'auth'}if(!r.ok)throw await r.text();return r}
function merge(R){if(R.nm&&R.nm.upd>(D.nm?.upd||0)){D.nm=R.nm;ON.me=D.nm.me;ON.wife=D.nm.wife}['acc','tx','inv'].forEach(k=>{const m=new Map((D[k]||[]).map(x=>[x.id,x]));(R[k]||[]).forEach(x=>{const y=m.get(x.id);if(!y||x.upd>y.upd)m.set(x.id,x)});D[k]=[...m.values()]})}
async function sync(){if(!tok)return auth(sync);try{$('#st').textContent='Syncing…';const q=encodeURIComponent("name='ledger-data.json' and trashed=false"),f=(await(await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`)).json()).files[0];
if(f){const t=await(await api(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).text();if(t.trim())merge(JSON.parse(t))}
persist();const body=JSON.stringify(D);if(f)await api(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
else{const b='b'+uid();await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n{"name":"ledger-data.json"}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`})}
render();$('#st').textContent='Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){$('#st').textContent='Not synced';toast(e=='auth'?'Signed out. Tap ⚙ to sync again.':'Sync failed: '+String(e).slice(0,90))}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
