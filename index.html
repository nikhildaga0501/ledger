.gr{flex:1;line-height:1.15;min-width:0}.gr small{color:var(--mut);font-size:14px;display:block}.gr b{font:700 21px Georgia,serif}
#st{font-size:10px;color:var(--mut);max-width:60px}
header button{background:var(--card);border:0;border-radius:50%;width:38px;height:38px;font-size:17px;box-shadow:0 2px 8px #14204A1F;padding:0;flex:none}
main{padding:8px 14px;max-width:720px;margin:auto}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;display:flex;background:var(--card);border-radius:22px;box-shadow:0 4px 22px #14204A2E;padding:4px;margin:auto;max-width:700px}
nav button{flex:1;padding:7px 0 5px;border:0;background:none;font:600 11px system-ui;color:var(--mut);border-bottom:3px solid transparent;border-radius:0}
nav button i{display:block;font-style:normal;font-size:20px}nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
.n{font-family:"Iowan Old Style",Georgia,serif;font-variant-numeric:tabular-nums}
.hero{background:var(--card);color:var(--ink);border-radius:20px;padding:18px;margin:6px 0 14px;box-shadow:var(--sh2)}.hero small{opacity:.85}.huge{font-size:34px;margin:4px 0}.sub{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 12px}
.tile{background:var(--card);border:0;border-radius:16px;padding:10px 1px;box-shadow:0 2px 10px #14204A14;font:600 11px system-ui;color:var(--ink)}
.tile i{display:grid;place-items:center;width:36px;height:36px;margin:0 auto 6px;border-radius:50%;background:var(--pri);color:#fff;font-style:normal;font-size:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{white-space:nowrap;border:0;background:var(--card);border-radius:99px;padding:8px 14px;font:inherit;box-shadow:0 1px 6px #14204A14}
.chip.on{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:var(--card);border-radius:18px;padding:13px;box-shadow:0 2px 12px #14204A14}
.big{font-size:22px;margin:2px 0}.mut{color:var(--mut);font-size:13px}.pos{color:var(--in)}.neg{color:var(--ex)}
button{font:inherit;border:1px solid var(--ln);background:var(--card);border-radius:12px;padding:9px 14px;color:var(--ink)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button.dg{color:var(--ex)}button.sm{padding:4px 10px;font-size:13px;margin-top:4px}.back{border:0;background:none;padding:6px 0;font-weight:600}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:8px;background:var(--card);border-radius:14px;box-shadow:0 1px 6px #14204A10}
h3{margin:4px 0 8px;font:600 18px Georgia,serif}h4{margin:18px 0 8px;font:600 17px Georgia,serif}
.tb{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 6px #14204A10}
.tb td,.tb th{padding:8px 6px;text-align:right;border-bottom:1px solid var(--ln)}.tb td:first-child,.tb th:first-child{text-align:left;padding-left:12px}
.ch{width:100%;background:var(--card);border-radius:16px}.lg{font-size:12px;color:var(--mut)}.lg i{display:inline-block;width:10px;height:10px;margin:0 4px 0 10px;border-radius:2px}
.dn{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 2px 12px #14204A14;margin-bottom:12px}
.lgd{flex:1;font-size:13px}.lgd div{display:flex;align-items:center;gap:6px;margin:4px 0}.lgd b{margin-left:auto}.lgd i{width:10px;height:10px;border-radius:50%;flex:none}
.ck{display:flex!important;align-items:center;gap:8px;color:var(--ink)!important;font-size:14px!important;padding:8px 0;border-bottom:1px solid var(--ln)}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sheet:not(.show){display:none}
.bd{position:fixed;inset:0;background:#0006;z-index:8}
.sh{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);z-index:9;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;max-width:720px;margin:auto}
label{display:block;margin:8px 0;font-size:13px;color:var(--mut)}
input,select{display:block;width:100%;margin-top:3px;padding:10px;font:16px system-ui;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink)}
input[type=checkbox]{display:inline;width:auto;margin-right:6px}
.ms{padding:8px 10px;border-radius:12px;margin:6px 0;white-space:pre-wrap}.ms.u{background:var(--mu);margin-left:28px}.ms.a{background:var(--ma);margin-right:28px}#cm{max-height:42vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;z-index:20;display:none;max-width:90%}
#toast.show{display:block}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden;overscroll-behavior-y:contain}
header{padding:14px 12px 6px;gap:6px}.gr b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gr small{white-space:nowrap}
main{padding:8px 12px}
nav button{flex:1 1 0;min-width:0;padding:7px 2px 5px;font-size:clamp(9px,2.8vw,11px)}nav button span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{gap:4px}.tile{min-width:0;padding:10px 0;font-size:clamp(9px,2.7vw,11px);overflow-wrap:anywhere}
.grid>*{min-width:0}.card{min-width:0;overflow-wrap:anywhere}.big{font-size:clamp(17px,5.6vw,22px)}.huge{font-size:clamp(26px,9vw,34px)}
.tx>div{min-width:0;overflow-wrap:anywhere}.tx>.n,.tx>span.n{flex:none;white-space:nowrap;overflow-wrap:normal}
.tb{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}.tb tbody{display:table;width:100%}.tb td:not(:first-child),.tb th:not(:first-child){white-space:nowrap}
.dn svg{width:min(130px,36vw);height:auto;flex:none}.lgd{min-width:0}
input,select{min-width:0;max-width:100%}
[data-sw]{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .12s}
[data-sw].swp{transition:none}[data-sw].swp::after{content:'÷ Split';position:absolute;left:100%;top:0;bottom:0;width:100px;display:grid;place-items:center;background:var(--gold);color:#fff;font-weight:700;border-radius:0 14px 14px 0}

function iaCSv(id,cid){const a=D.ia.find(x=>x.id==id),amt=+$('#a').value;if(!(amt>0))return toast('Enter an amount');let c=cid?D.inv.find(x=>x.id==cid):null;const old=c?c.amt:0;if(/tfsa/i.test(a.name)&&a.room!=null&&amt-old>a.room&&!confirm('This is more than your TFSA room left ('+fm(a.room)+'). The CRA charges 1% a month on the excess. Save anyway?'))return;if(!c){c={id:uid(),owner:a.owner,cur:'CAD',name:a.name,ia:id};D.inv.push(c)}Object.assign(c,{date:$('#d').value,amt,from:$('#fr').value});touch(c);if(a.room!=null){a.room=Math.max(0,a.room+old-amt);touch(a)}save();shut();render();toast('Contribution saved')}

function iaRead(id,inp){const f=inp.files[0];if(!f)return;$('#mp').innerHTML='<p class=mut>Claude is reading your statement. This can take up to a minute…</p>';const isP=/\.pdf$/i.test(f.name),r=new FileReader();r.onload=async()=>{try{const blk=isP?{type:'document',source:{type:'base64',media_type:'application/pdf',data:r.result.split(',')[1]}}:{type:'text',text:'Statement file contents:\n'+String(r.result).slice(0,60000)},J=await aiJ([blk,{type:'text',text:IAP}],8000),ok=/^\d{4}-\d\d-\d\d$/,asof=ok.test(J.asof||'')?J.asof:today(),rows=(J.holdings||[]).filter(x=>x&&(+x.val>0||+x.qty>0));if(!rows.length)throw 'No holdings were found in this file.';
const old=iaH(id),mo=new Map(old.map(h=>[h.sym,h])),ib=uid(),nh=rows.map(x=>{const val=+x.val||0,nc=x.cost==null||x.cost===''||!isFinite(+x.cost),h=touch({id:uid(),ia:id,sym:String(x.sym||x.name||'?').toUpperCase().slice(0,12),name:String(x.name||'').slice(0,60),qty:+x.qty||0,val,cost:nc?val:+x.cost,cur:CUR(x.cur),ib});if(nc)h.nc=1;return h}),ns=new Set(nh.map(h=>h.sym)),add=nh.filter(h=>!mo.has(h.sym)).length,rem=old.filter(h=>!ns.has(h.sym)).length,chg=nh.filter(h=>mo.has(h.sym)&&Math.abs(mo.get(h.sym).qty-h.qty)>1e-9).length,prev=old.map(h=>h.id);
old.forEach(h=>{h.del=1;touch(h)});nh.forEach(h=>D.hold.push(h));const a=D.ia.find(x=>x.id==id),pa=a.asof||'',sn0=!!L(D.snap).find(x=>x.ia==id&&x.date==asof);a.asof=asof;touch(a);snapIt(id,asof);const sid=L(D.snap).find(x=>x.ia==id&&x.date==asof).id;cfg.lh={ia:id,ib,prev,asof,pa,sid,sn0,add,rem,chg,n:nh.length};persist();save();render();
open(`<h3>✅ Holdings updated</h3><p>${nh.length} holdings · ${fm(iaVal(a))} as of ${asof}</p><p class=mut>${add} new · ${rem} removed · ${chg} with changed units</p><div class=row><button class=pri onclick=shut()>Okay</button><button class=dg onclick="iaUndo()">Undo</button></div>`)}catch(e){$('#mp').innerHTML='<p class=neg>'+esc(String(e).slice(0,200))+'</p>'}};isP?r.readAsDataURL(f):r.readAsText(f)}

function auth(){if(!cfg.cid)return setg();const RU=location.origin+location.pathname.replace(/index\.html$/,'');location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:cfg.cid,redirect_uri:RU,response_type:'token',scope:'https://www.googleapis.com/auth/drive'})}
